plugins {
    id 'net.neoforged.gradle.userdev' version '7.0.171'
}

version = '2.0.1'
group = 'com.glennfo.gradium'

base {
    archivesName = 'gradium'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

runs {
    configureEach {
        systemProperty 'neoforge.logging.markers', 'REGISTRIES'
        systemProperty 'neoforge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    server {
        programArgument '--nogui'
    }
}

dependencies {
    implementation "net.neoforged:neoforge:21.1.233"
}
